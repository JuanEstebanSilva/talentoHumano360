# ═══════════════════════════════════════════════════════════════════════════════
# Talento 360 — Render Blueprint (Infraestructura como Código)
# ═══════════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: talento360-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Configurar de forma segura en el Dashboard de Render (nunca commitear credenciales)
