# ═══════════════════════════════════════════════════════════════════════════════
# Talento 360 — Render Blueprint (Infraestructura como Código)
# ═══════════════════════════════════════════════════════════════════════════════

databases:
  - name: talento360-db
    databaseName: talento360
    plan: free
    region: oregon

services:
  - type: web
    name: talento360-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DATABASE_URL
        fromDatabase:
          name: talento360-db
          property: connectionString
