name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'ci/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    env:
      DB_SSL: 'false'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: talento360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check web/backend/server.js
          node --check web/backend/scripts/init-db.js

      - name: Init PostgreSQL database
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/talento360
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/talento360
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: talento360
          NODE_ENV: test
        run: npm run db:init

      - name: Start backend server
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/talento360
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/talento360
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: talento360
          PORT: '3000'
          JWT_SECRET: talento360_ci_jwt_secret_token_key_2026
          ALLOWED_ORIGINS: http://localhost:3000
          APP_PUBLIC_URL: http://localhost:3000
          APP_URL: http://localhost:3000
          BACKEND_PUBLIC_URL: http://localhost:3000
          NODE_ENV: test
          AUTO_INIT_DB: 'false'
        run: |
          node web/backend/server.js &
          for i in {1..30}; do
            if curl -s -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

      - name: Run test suite
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/talento360
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/talento360
          TEST_URL: http://localhost:3000
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: talento360
          JWT_SECRET: talento360_ci_jwt_secret_token_key_2026
          NODE_ENV: test
        run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
