events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Hardening de Servidor ────────────────────────────────────────────────
    server_tokens off;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    client_max_body_size 50M;
    client_body_buffer_size 16M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # ── Rate Limiting (Protección contra Fuerza Bruta y DoS) ─────────────────
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_status 429;

    # ── Upstream Microservices ────────────────────────────────────────────────
    upstream auth_service         { server auth-service:3001; }
    upstream employees_service    { server employees-service:3002; }
    upstream requests_service     { server requests-service:3003; }
    upstream admin_requests_service { server admin-requests-service:3004; }
    upstream viaticos_service     { server viaticos-service:3005; }
    upstream dashboard_service    { server dashboard-service:3006; }
    upstream horarios_service     { server horarios-service:3007; }
    upstream sst_service          { server sst-service:3008; }

    server {
        listen 80;
        server_name _;

        # ── Cabeceras HTTP de Seguridad (OWASP ASVS Standard) ────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:* https://*.onrender.com; frame-src 'self' data: blob:; object-src 'none';" always;

        # ── Bloqueo de endpoints administrativos eliminados o peligrosos ──────
        location /api/admin/ {
            return 404 '{"error":"Endpoint administrativo no disponible o eliminado por seguridad."}';
            default_type application/json;
        }

        # ── API Gateway Routes: Autenticación con Rate Limiting Estricto ─────
        location = /api/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass         http://auth_service/api/auth/login;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass         http://auth_service/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/employees {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass         http://employees_service;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/requests {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass         http://requests_service;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/admin-requests {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass         http://admin_requests_service;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/viaticos {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass         http://viaticos_service;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/dashboard {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass         http://dashboard_service;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/horarios {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass         http://horarios_service;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/sst {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass         http://sst_service;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Archivos SEO y Seguridad Estáticos ─────────────────────────────────
        location = /robots.txt {
            root /usr/share/nginx/html;
            default_type text/plain;
            access_log off;
            log_not_found off;
            add_header Cache-Control "public, max-age=86400";
        }

        location = /sitemap.xml {
            root /usr/share/nginx/html;
            default_type application/xml;
            access_log off;
            log_not_found off;
            add_header Cache-Control "public, max-age=86400";
        }

        # ── JS / CSS / HTML - No-Cache durante desarrollo con Cabeceras de Seguridad ──
        location ~* \.(?:html?|js|css)$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:* https://*.onrender.com; frame-src 'self' data: blob:; object-src 'none';" always;
        }

        # ── SPA Frontend ──────────────────────────────────────────────────────
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:* https://*.onrender.com; frame-src 'self' data: blob:; object-src 'none';" always;
        }
    }
}
