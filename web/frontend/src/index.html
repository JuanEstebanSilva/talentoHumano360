  <!-- Instant Settings Bootstrap (Anti-FOUC) — Per-user preference isolation -->
  <script>
    (function () {
      try {
        var userStr = localStorage.getItem('h360_user');
        var username = null;
        if (userStr) {
          try {
            var u = JSON.parse(userStr);
            if (u && u.username) username = u.username.trim().toLowerCase();
          } catch (e) { }
        }
        var key = username ? ('talento360_settings_' + username) : 'talento360_user_settings';
        var s = JSON.parse(localStorage.getItem(key) || '{}');
        if (s.fontSize) document.documentElement.setAttribute('data-font-size', s.fontSize);
        var t = s.theme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-theme-setting', t);
        if (t === 'dark') {
          var fv = document.getElementById('app-favicon');
          if (fv) fv.setAttribute('href', 'imgs/logoCondorBlanco.png');
          var mt = document.querySelector('meta[name="theme-color"]');
          if (mt) mt.setAttribute('content', '#041624');
        }
        if (s.highContrast) document.documentElement.setAttribute('data-high-contrast', 'true');
        if (s.reduceMotion) document.documentElement.setAttribute('data-reduce-motion', 'true');
        if (s.density) document.documentElement.setAttribute('data-density', s.density);
      } catch (e) { }
    })();
  </script>
