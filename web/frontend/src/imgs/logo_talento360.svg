<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="gradVerde" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E5619" />
      <stop offset="100%" stop-color="#28871B" />
    </linearGradient>
    <linearGradient id="gradDorado" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D1AD2A" />
      <stop offset="100%" stop-color="#F5C518" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Texto Principal: Talento 360 -->
  <g id="Logotipo">
    <text x="50" y="150" font-family="'Segoe UI', 'Montserrat', Arial, sans-serif" font-size="110" font-weight="800" fill="#1E5619" letter-spacing="-1px">
      Talento
    </text>
    <text x="465" y="150" font-family="'Arial Black', 'Segoe UI', Arial, sans-serif" font-size="115" font-weight="900" fill="url(#gradDorado)">
      360
    </text>
    <circle cx="695" cy="75" r="10" stroke="#D1AD2A" stroke-width="4" fill="none" />
  </g>

  <!-- Arco Orbital 360 Grados -->
  <path d="M 460,110 A 130 55 0 0 1 730,110" fill="none" stroke="#28871B" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
  <path d="M 730,125 A 130 55 0 0 1 480,145" fill="none" stroke="url(#gradDorado)" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />

  <!-- Línea Divisoria -->
  <line x1="50" y1="185" x2="735" y2="185" stroke="#28871B" stroke-width="3.5" stroke-linecap="round" />
  <line x1="50" y1="185" x2="280" y2="185" stroke="#D1AD2A" stroke-width="3.5" stroke-linecap="round" />

  <!-- Subtítulo Institucional -->
  <text x="52" y="222" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#007BC7" letter-spacing="1.5px">
    DIRECCIÓN DE TALENTO HUMANO
  </text>
  <text x="400" y="222" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#64748B" letter-spacing="1.5px">
    •  GOBERNACIÓN DE BOYACÁ
  </text>
  <text x="52" y="252" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#94A3B8" letter-spacing="2px">
    SISTEMA INTEGRADO DE GESTIÓN PÚBLICA TERRITORIAL
  </text>
</svg>
