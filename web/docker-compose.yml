services:
  # ─────────────────────────────────────────────────
  # DATABASE
  # ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: talento360_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talento360}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../database/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql
      - ../database/03_new_modules.sql:/docker-entrypoint-initdb.d/03_new_modules.sql
      - ../database/04_horarios.sql:/docker-entrypoint-initdb.d/04_horarios.sql
      - ../database/05_divipola_and_hr_rules.sql:/docker-entrypoint-initdb.d/05_divipola_and_hr_rules.sql
      - ../database/06_hr_updates_experiencia_multiple.sql:/docker-entrypoint-initdb.d/06_hr_updates_experiencia_multiple.sql
      - ../database/07_add_tiempo_total_gobernacion.sql:/docker-entrypoint-initdb.d/07_add_tiempo_total_gobernacion.sql
      - ../database/08_full_divipola_update.sql:/docker-entrypoint-initdb.d/08_full_divipola_update.sql
      - ../database/09_cargos_nivel_update.sql:/docker-entrypoint-initdb.d/09_cargos_nivel_update.sql
    ports:
      - "5432:5432"
    networks:
      - talento360_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────
  # MICROSERVICE 2 — Auth Service
  # ─────────────────────────────────────────────────
  auth-service:
    build: ./services/auth-service
    container_name: talento360_auth
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 3 — Employees Service
  # ─────────────────────────────────────────────────
  employees-service:
    build: ./services/employees-service
    container_name: talento360_employees
    restart: unless-stopped
    environment:
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 4 — Requests Service (Vacaciones)
  # ─────────────────────────────────────────────────
  requests-service:
    build: ./services/requests-service
    container_name: talento360_requests
    restart: unless-stopped
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 5 — Admin Requests Service
  # ─────────────────────────────────────────────────
  admin-requests-service:
    build: ./services/admin-requests-service
    container_name: talento360_admin_requests
    restart: unless-stopped
    environment:
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 6 — Viáticos Service
  # ─────────────────────────────────────────────────
  viaticos-service:
    build: ./services/viaticos-service
    container_name: talento360_viaticos
    restart: unless-stopped
    environment:
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 7 — Dashboard Service
  # ─────────────────────────────────────────────────
  dashboard-service:
    build: ./services/dashboard-service
    container_name: talento360_dashboard
    restart: unless-stopped
    environment:
      PORT: 3006
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 8 — Horarios Service
  # ─────────────────────────────────────────────────
  horarios-service:
    build: ./services/horarios-service
    container_name: talento360_horarios
    restart: unless-stopped
    environment:
      PORT: 3007
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net

  # ─────────────────────────────────────────────────
  # FRONTEND + GATEWAY (Nginx)
  # ─────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: talento360_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/src:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - employees-service
      - requests-service
      - admin-requests-service
      - viaticos-service
      - dashboard-service
      - horarios-service
    networks:
      - talento360_net

volumes:
  postgres_data:

networks:
  talento360_net:
    driver: bridge
