services:
  # ─────────────────────────────────────────────────
  # DATABASE
  # ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: talento360_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talento360}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432:5432}"
    networks:
      - talento360_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────
  # MICROSERVICE 2 — Auth Service
  # ─────────────────────────────────────────────────
  auth-service:
    build: ./services/auth-service
    container_name: talento360_auth
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 3 — Employees Service
  # ─────────────────────────────────────────────────
  employees-service:
    build: ./services/employees-service
    container_name: talento360_employees
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
    volumes:
      - ./services/employees-service/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 4 — Requests Service (Vacaciones)
  # ─────────────────────────────────────────────────
  requests-service:
    build: ./services/requests-service
    container_name: talento360_requests
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 5 — Admin Requests Service
  # ─────────────────────────────────────────────────
  admin-requests-service:
    build: ./services/admin-requests-service
    container_name: talento360_admin_requests
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
    volumes:
      - ./services/admin-requests-service/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 6 — Viáticos Service
  # ─────────────────────────────────────────────────
  viaticos-service:
    build: ./services/viaticos-service
    container_name: talento360_viaticos
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
    volumes:
      - ./services/viaticos-service:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 7 — Dashboard Service
  # ─────────────────────────────────────────────────
  dashboard-service:
    build: ./services/dashboard-service
    container_name: talento360_dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      TZ: America/Bogota # La copia diaria programada usa la hora de Colombia.
      PORT: 3006
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
    volumes:
      - backups_data:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 8 — Horarios Service
  # ─────────────────────────────────────────────────
  horarios-service:
    build: ./services/horarios-service
    container_name: talento360_horarios
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3007
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
    volumes:
      - ./services/horarios-service:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 9 — SST Service (Seguridad y Salud en el Trabajo)
  # ─────────────────────────────────────────────────
  sst-service:
    build: ./services/sst-service
    container_name: talento360_sst
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3008
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
    volumes:
      - ./services/sst-service/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 10 — Documents Service (Gestión documental)
  # ─────────────────────────────────────────────────
  documents-service:
    build: ./services/documents-service
    container_name: talento360_documents
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3009
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
      DOCUMENTS_STORAGE_DIR: /data/documentos
      DOCUMENTS_INBOX_DIR: /data/bandeja
    volumes:
      - documents_data:/data/documentos
      - documents_inbox:/data/bandeja
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 11 — Reports Service (Informes y automatización)
  # ─────────────────────────────────────────────────
  reports-service:
    build: ./services/reports-service
    container_name: talento360_reports
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3010
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-talento360_secret_2026}
    volumes:
      - ../database:/app/database:ro # Migraciones 28 a 32, aplicadas al arrancar.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talento360_net


  # ─────────────────────────────────────────────────
  # FRONTEND + GATEWAY (Nginx)
  # ─────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: talento360_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/src:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - employees-service
      - requests-service
      - admin-requests-service
      - viaticos-service
      - dashboard-service
      - horarios-service
      - sst-service
      - documents-service
      - reports-service
    networks:
      - talento360_net

volumes:
  postgres_data:
  backups_data:
  documents_data:
  documents_inbox:

networks:
  talento360_net:
    driver: bridge
